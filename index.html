<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTPS Login Demo</title>
    <style>
        body { font-family: sans-serif; margin: 50px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 200px; }
        button { padding: 10px 20px; background-color: #007cba; color: white; border: none; cursor: pointer; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>安全登录演示</h1>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">用户名:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">密码:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">登录</button>
    </form>
    <div id="message"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // 阻止表单默认提交行为

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');

            // 简单的硬编码验证
            if (username === 'demo' && password === 'secret123') {
                messageEl.style.color = 'green';
                messageEl.textContent = '登录成功！';
            } else {
                messageEl.style.color = 'red';
                messageEl.textContent = '用户名或密码错误！';
            }

            // 关键：为了在Wireshark中更容易找到，我们可以打印出提交的数据
            console.log(`[Wireshark捕获目标] 提交的数据 - 用户名: ${username}, 密码: ${password}`);
        });
    </script>
</body>
</html>
